name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast gate. Everything protocol-level is verifiable with no simulator,
  # which is most of the code and nearly all of the subtle code.
  packages:
    name: Package tests
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [CombCore, CombStore, CombNet]
    steps:
      - uses: actions/checkout@v4

      # Runner images change their bundled Xcode versions without notice, so
      # pick the newest one present rather than pinning a path that will rot.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.build
          key: spm-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.resolved', matrix.package)) }}
          restore-keys: spm-${{ matrix.package }}-

      - name: Test
        run: swift test --package-path ${{ matrix.package }}

  app:
    name: App build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Running the app target's tests needs a real device, not the generic
      # destination a build accepts, and the runner images change which devices
      # they ship without notice. So pick one rather than pinning a name.
      #
      # Three things this has to get right, each of which a simpler expression
      # gets wrong:
      #
      #   - A runtime can be installed and available with no devices created.
      #     Most of them are, in practice. Picking the newest runtime and then
      #     looking for a device in it fails on a runner that has exactly what
      #     we need one version down.
      #   - Runtime identifiers sort lexicographically, so iOS-26-2 beats
      #     iOS-26-10 and iOS-9-3 beats both. Compare them as numbers.
      #   - The app's deployment target is iOS 26.0. An older runtime would be
      #     picked happily and then fail in xcodebuild with an error that reads
      #     like a code problem rather than a runner problem.
      - name: Pick a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | map({
                version: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)),
                iphones: (.value | map(select(.name | startswith("iPhone"))))
              })
            | map(select(.iphones | length > 0))
            | map(select(.version[0] >= 26))
            | sort_by(.version)
            | last | .iphones[0].udid // empty
          ')
          if [ -z "$udid" ]; then
            echo "no iOS 26+ runtime on this runner has an iPhone device:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available -j | jq -r --arg udid "$udid" '
            .devices | to_entries[] | .key as $runtime | .value[]
            | select(.udid == $udid) | "testing on \(.name) (\($runtime))"
          '
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # swift-secp256k1 ships a build plugin that Xcode will not run without
      # interactive trust, hence the skip flags.
      #
      # `test` rather than `build`, because the app target's own suite now
      # covers the session: the join between socket and store, which the
      # package suites cannot reach and nothing ran until this step existed.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Comb.xcodeproj \
            -scheme Comb \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # A feature once shipped whose control was never offered: it compiled, its
  # view was correct, and 483 tests were green because nothing tests a view.
  # This is the cheap half of the answer, and it needs neither Xcode nor a
  # simulator, so it runs beside the build rather than behind it.
  dead-ui:
    name: Unreachable UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for UI that cannot be reached
        run: ./scripts/check-dead-ui.sh

  # Issue forms fail silently: GitHub hides an unusable template and redirects
  # its `?template=` link to the chooser without reporting anything. The app
  # links straight to one of these from its Browse screen, so a broken form
  # reads to a would-be contributor as a dead end in the product.
  issue-templates:
    name: Issue templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check templates parse and their labels exist
        run: ./scripts/check-issue-templates.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
